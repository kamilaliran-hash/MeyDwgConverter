name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache LibreDWG build
        id: cache-libredwg
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/libredwg
          key: libredwg-${{ hashFiles('scripts/build-libredwg.sh') }}-${{ env.NDK_VERSION }}

      - name: Build LibreDWG for Android
        if: steps.cache-libredwg.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          chmod +x scripts/build-libredwg.sh
          ./scripts/build-libredwg.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk MeyDwgConverter.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeyDwgConverter-apk
          path: MeyDwgConverter.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MeyDwgConverter.apk
